[project]
name = "fast-api"
version = "0.1.0"
description = "Just a learning project - FastAPI with PostgreSQL which gonna make some kinda noting web-service - all note will be saved in DB, and then just SELECT'ed in next launch to keep history"
authors = [{ name = "Silletr", email = "silletrMain@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12,<4.0"
dependencies = ["asyncpg (>=0.31.0,<0.32.0)", "fastapi (>=0.136.3,<0.137.0)", "loguru (>=0.7.3,<0.8.0)", "httpx (>=0.28.1,<0.29.0)", "flet (>=0.85.3,<0.86.0)"]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
